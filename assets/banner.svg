  <!-- Card -->
  <rect width="880" height="520" rx="28" fill="#0A1410"/>
  <rect width="880" height="520" rx="28" fill="url(#aura)"/>
  <rect x="1.5" y="1.5" width="877" height="517" rx="26.5" fill="none" stroke="#1E3B34" stroke-width="1.5"/>

  <!-- Header ornament -->
