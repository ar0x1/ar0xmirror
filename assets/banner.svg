      <stop offset="0"    stop-color="#2EE6C5" stop-opacity="0.12"/>
      <stop offset="0.45" stop-color="#2EE6C5" stop-opacity="0.05"/>
      <stop offset="1"    stop-color="#2EE6C5" stop-opacity="0"/>
    </radialGradient>

    <!-- "AR0X" as pure vector pixel blocks: 14px blocks on an exact 18px grid -->
    <g id="word-ar0x">
