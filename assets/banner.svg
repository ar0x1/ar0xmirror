      <path d="M199 94h50v14h-50zM181 112h14v14h-14zM253 112h14v14h-14zM163 130h14v14h-14zM271 130h14v14h-14zM163 148h122v14h-122zM163 166h14v14h-14zM271 166h14v14h-14zM163 184h14v14h-14zM271 184h14v14h-14z"/>
