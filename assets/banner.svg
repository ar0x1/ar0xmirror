  <use href="#word-mirror" xlink:href="#word-mirror" fill="none" stroke="#2EE6C5" stroke-width="14" opacity="0.06"/>
  <use href="#word-ar0x"   xlink:href="#word-ar0x"   fill="none" stroke="#2EE6C5" stroke-width="7"  opacity="0.16"/>
  <use href="#word-mirror" xlink:href="#word-mirror" fill="none" stroke="#2EE6C5" stroke-width="7"  opacity="0.16"/>

