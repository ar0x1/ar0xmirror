<?xml version="1.0" encoding="UTF-8"?>
<!-- AR0X MIRROR banner - self-contained static SVG, safe for GitHub README embedding -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="880" height="520" viewBox="0 0 880 520" preserveAspectRatio="xMidYMid meet" role="img">
  <title>AR0X MIRROR</title>

  <defs>
