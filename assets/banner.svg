  <rect x="458" y="225" width="50" height="2" fill="#1D453C"/>
  <polygon points="440,220 446,226 440,232 434,226" fill="#2EE6C5" opacity="0.9"/>

  <!-- Title -->
  <use href="#word-ar0x"   xlink:href="#word-ar0x"   fill="url(#titleTeal)"/>
  <use href="#word-mirror" xlink:href="#word-mirror" fill="url(#titleTeal)"/>

  <!-- Subtitle -->
