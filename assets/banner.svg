      <stop offset="0"    stop-color="#1FB3A0"/>
      <stop offset="0.35" stop-color="#2EE6C5"/>
      <stop offset="0.5"  stop-color="#9DFFF0"/>
      <stop offset="0.65" stop-color="#2EE6C5"/>
      <stop offset="1"    stop-color="#1FB3A0"/>
    </linearGradient>

    <!-- Ambient glow behind the lettering (replaces the old blur filter) -->
