<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500"
     font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">
  <defs>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0" spreadMethod="repeat">
      <stop offset="0"    stop-color="#1FB3A0"/>
      <stop offset="0.40" stop-color="#2EE6C5"/>
      <stop offset="0.50" stop-color="#9DFFF0"/>
      <stop offset="0.60" stop-color="#2EE6C5"/>
      <stop offset="1"    stop-color="#1FB3A0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        from="0 0" to="880 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#2EE6C5" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2EE6C5" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <style>
    @keyframes gp{50%{opacity:.14}}
    @keyframes dp{50%{opacity:.35}}
    @keyframes scan{from{transform:translateY(70px)}to{transform:translateY(478px)}}
    .glow{animation:gp 4s ease-in-out infinite}
    .dia{animation:dp 3.2s ease-in-out infinite}
    .scan{animation:scan 6.5s linear infinite}
  </style>

  <rect width="880" height="500" rx="28" fill="#0A0E14"/>
  <rect x="1.5" y="1.5" width="877" height="497" rx="26" fill="none" stroke="#1C2733" stroke-width="1.5"/>
  <rect width="880" height="500" rx="28" fill="url(#aura)"/>
  <rect class="scan" width="880" height="2" fill="#2EE6C5" opacity="0.06"/>

  <text x="440" y="44" text-anchor="middle" font-size="13" fill="#3A4750">────────────────</text>
  <text x="440" y="49" text-anchor="middle" font-size="11" fill="#2EE6C5" class="dia">◆</text>

  <g id="wordA" fill="url(#flow)" font-size="26" xml:space="preserve" text-anchor="middle">
    <text x="440" y="84">  ███   ██████   █████  █     █</text>
    <text x="440" y="114"> █   █  █     █ █     █  █   █ </text>
    <text x="440" y="144">█     █ █     █ █     █   █ █  </text>
    <text x="440" y="174">███████ ██████  █     █   █ █  </text>
    <text x="440" y="204">█     █ █   ██  █     █  █   █ </text>
    <text x="440" y="234">█     █ █    █   █████  █     █</text>
  </g>

  <text x="440" y="264" text-anchor="middle" font-size="10" fill="#2EE6C5" class="dia">◆</text>

  <g id="wordB" fill="url(#flow)" font-size="26" xml:space="preserve" text-anchor="middle">
    <text x="440" y="296">█     █   ███   ██████  ██████   █████  ██████ </text>
    <text x="440" y="326">██   ██    █    █     █ █     █ █     █ █     █</text>
    <text x="440" y="356">█ █ █ █    █    █     █ █     █ █     █ █     █</text>
    <text x="440" y="386">█  █  █    █    ██████  ██████  █     █ ██████ </text>
    <text x="440" y="416">█     █    █    █   ██  █   ██  █     █ █   ██ </text>
    <text x="440" y="446">█     █   ███   █    █  █    █   █████  █    █ </text>
  </g>

  <use href="#wordA" filter="url(#blur)" class="glow" opacity="0.22"/>
  <use href="#wordB" filter="url(#blur)" class="glow" opacity="0.22"/>

  <text x="440" y="474" text-anchor="middle" font-size="14" letter-spacing="3" fill="#8FA8A3">one command · the whole site · yours forever</text>
  <text x="440" y="493" text-anchor="middle" font-size="11.5" letter-spacing="1" fill="#5C716D">v2.2.0 · crafted by ar0x · github.com/ar0x1</text>
</svg>