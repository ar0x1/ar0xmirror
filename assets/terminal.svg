<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400"
     font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace">
  <defs>
    <linearGradient id="bgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#2EE6C5" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#2EE6C5" stop-opacity="0.9"/>
      <stop offset="0.5"  stop-color="#9DFFF0"/>
      <stop offset="0.88" stop-color="#2EE6C5" stop-opacity="0.9"/>
      <stop offset="1"    stop-color="#2EE6C5" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="barclip"><rect x="58" y="192" width="764" height="14" rx="7"/></clipPath>
  </defs>
  <style>
    @keyframes sp{0%,9.9%{opacity:1}10%,100%{opacity:0}}
    @keyframes st3{0%,32.9%{opacity:1}33.3%,100%{opacity:0}}
    @keyframes st5{0%,19.9%{opacity:1}20.2%,100%{opacity:0}}
    @keyframes bl{50%{opacity:0}}
    .sp text{opacity:0;animation:sp 1s steps(1) infinite}
    .caret{animation:bl 1.1s steps(1) infinite}
  </style>

  <rect width="880" height="400" rx="22" fill="#0C1117"/>
  <rect x="1.5" y="1.5" width="877" height="397" rx="20" fill="none" stroke="#22303C" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M2 21 a20 20 0 0 1 20-20 h836 a20 20 0 0 1 20 20 v21 H2 Z" fill="#0A0E14"/>
  <line x1="2" y1="42" x2="878" y2="42" stroke="#18212B" stroke-width="1.5"/>
  <circle cx="26" cy="21" r="5.5" fill="#1B2733" stroke="#2B3A47"/>
  <circle cx="48" cy="21" r="5.5" fill="#1B2733" stroke="#2B3A47"/>
  <circle cx="70" cy="21" r="5.5" fill="#1B2733" stroke="#2B3A47"/>
  <text x="440" y="26" text-anchor="middle" font-size="12" fill="#5C716D">ar0x mirror — mirroring now</text>
  <text x="852" y="26" text-anchor="end" font-size="10" fill="#3A4750">v2.2</text>

  <!-- header -->
  <text x="40" y="68" font-size="13" fill="#2EE6C5">◆</text>
  <text x="56" y="68" font-size="13" fill="#8FA8A3">ar0x mirror v2.2 · one wget command, maxed out</text>

  <!-- frame -->
  <rect x="36" y="84" width="808" height="292" rx="10" fill="none" stroke="#38424D" stroke-width="1.2"/>
  <rect x="60" y="76" width="296" height="16" fill="#0C1117"/>
  <text x="64" y="88" font-size="12" fill="#38B2A4" font-weight="600">◆ MIRRORING · example.com</text>

  <!-- spinner -->
  <g class="sp" font-size="14" fill="#2EE6C5">
    <text x="58" y="124" style="animation-delay:0s">⠋</text>
    <text x="58" y="124" style="animation-delay:-0.1s">⠙</text>
    <text x="58" y="124" style="animation-delay:-0.2s">⠹</text>
    <text x="58" y="124" style="animation-delay:-0.3s">⠸</text>
    <text x="58" y="124" style="animation-delay:-0.4s">⠼</text>
    <text x="58" y="124" style="animation-delay:-0.5s">⠴</text>
    <text x="58" y="124" style="animation-delay:-0.6s">⠦</text>
    <text x="58" y="124" style="animation-delay:-0.7s">⠧</text>
    <text x="58" y="124" style="animation-delay:-0.8s">⠇</text>
    <text x="58" y="124" style="animation-delay:-0.9s">⠏</text>
  </g>

  <!-- live stats, cycling -->
  <g font-size="13.5" fill="#9FB8B3">
    <text x="86" y="124" style="animation:st3 12s infinite;animation-delay:0s">  12 files · 1.1M · 00:04 · 240K/s</text>
    <text x="86" y="124" style="animation:st3 12s infinite;animation-delay:-8s">  31 files · 2.4M · 00:09 · 260K/s</text>
    <text x="86" y="124" style="animation:st3 12s infinite;animation-delay:-4s">  47 files · 3.2M · 00:14 · 230K/s</text>
  </g>

  <!-- last file saved, cycling -->
  <g font-size="12.5" fill="#6E807B">
    <text x="58" y="156" style="animation:st5 12.5s infinite;animation-delay:0s">↳ example.com/index.html</text>
    <text x="58" y="156" style="animation:st5 12.5s infinite;animation-delay:-10s">↳ example.com/assets/main.css</text>
    <text x="58" y="156" style="animation:st5 12.5s infinite;animation-delay:-7.5s">↳ example.com/about/index.html</text>
    <text x="58" y="156" style="animation:st5 12.5s infinite;animation-delay:-5s">↳ example.com/img/hero.jpg</text>
    <text x="58" y="156" style="animation:st5 12.5s infinite;animation-delay:-2.5s">↳ example.com/blog/getting-started/index.html</text>
  </g>

  <!-- marching progress bar -->
  <rect x="58" y="192" width="764" height="14" rx="7" fill="#101922"/>
  <g clip-path="url(#barclip)">
    <rect x="58" y="192" width="250" height="14" fill="url(#bgrad)">
      <animateTransform attributeName="transform" type="translate"
                        values="-260 0; 830 0" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="58" y="246" font-size="12" fill="#5C716D">ctrl+c stops clean — the partial mirror is kept</text>

  <!-- verification -->
  <line x1="37" y1="268" x2="843" y2="268" stroke="#22303C" stroke-width="1.2"/>
  <text x="58" y="296" font-size="13" fill="#5C716D">&lt;tspan fill="#3A4750"&gt;<tspan fill="#3A4750">$</tspan> du -sh ./example.comlt;/tspan&gt; du -sh ./example.com</text>
  <text x="58" y="316" font-size="13" fill="#2EE6C5">3.4M  ./example.com</text>
  <text x="58" y="344" font-size="13" fill="#5C716D">&lt;tspan fill="#3A4750"&gt;<tspan fill="#3A4750">$</tspan> find ./example.com -type f | wc -llt;/tspan&gt; find ./example.com -type f | wc -l</text>
  <text x="58" y="364" font-size="13" fill="#2EE6C5" font-weight="600">47</text>
  <text x="84" y="364" font-size="13" fill="#2EE6C5" class="caret">▊</text>
</svg>